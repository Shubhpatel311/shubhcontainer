name: Build WF with Maven and MySQL

# This trigger remains the same: runs on a push to the main branch.
on:
  push:
    branches:
      - main

jobs:
  build:
    
    runs-on: ubuntu-latest

    steps:
     
      - name: Checkout repository
        uses: actions/checkout@v4

     
      - name: Set up JDK 17 and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install and Start MySQL 8
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server-8.0
          sudo /etc/init.d/mysql start
          echo "MySQL 8 Server started."

     